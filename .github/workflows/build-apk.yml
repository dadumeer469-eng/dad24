name: Build Android APK (Capacitor, bundled)

# Builds the Dadu Food Android APK from the Capacitor project on GitHub's
# servers (local Gradle cannot run in the dev VM — its daemon is killed).
# The APK bundles the web code inside (dist/), so it opens offline and
# feels like a real installed app. Trigger manually, or on pushes that
# touch the Capacitor config / package / workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'
      - 'scripts/add-android-permissions.py'
      - 'assets/**'
      - 'src/**'
      - 'api/**'
      - 'public/**'

# The release-attach step needs write access to the repo's releases.
# Without this, GITHUB_TOKEN gets HTTP 403 "Resource not accessible by
# integration" when uploading the APK to the release.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        # android-actions/setup-android@v3 FAILS (tries to install the removed
        # 'tools' package — sdkmanager exits 1). Install the SDK ourselves
        # with a direct cmdline-tools download (deterministic, no proxy here).
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d cmdtools-tmp
          mv cmdtools-tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          rm -rf cmdtools-tmp cmdtools.zip
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Add Android platform
        run: npx cap add android

      - name: Add ALL app permissions (location, camera, mic, storage, notifications)
        # The generated manifest only has INTERNET. A food delivery app
        # needs GPS (delivery + rider tracking), camera + gallery
        # (Easypaisa receipt photo), microphone (Munchi voice agent) and
        # notifications (order updates). This injects every permission
        # (user 28 Nov 02:47: "sari permission dalo").
        run: python3 scripts/add-android-permissions.py

      - name: Generate app icon + splash screen (professional branding)
        # Reads assets/icon.png, assets/icon-background.png, assets/splash.png
        # (the real Dadu Food logo) and writes all Android launcher icons
        # + splash drawables into android/app/src/main/res/.
        run: npx @capacitor/assets generate --android

      - name: Sync web code into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dadufood-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to release v1.0.0-apk
        # The cloud browser cannot open a file picker to attach the APK to
        # the release by hand, so the workflow attaches it itself with the
        # built-in GITHUB_TOKEN (gh CLI is preinstalled on the runner).
        # This makes the APK publicly downloadable from the release page.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DaduFood-v1.0.0.apk
          gh release upload v1.0.0-apk DaduFood-v1.0.0.apk --clobber
