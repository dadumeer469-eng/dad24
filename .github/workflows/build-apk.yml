name: Build Android APK (Capacitor, bundled)

# Builds the Dadu Food Android APK from the Capacitor project on GitHub's
# servers (local Gradle cannot run in the dev VM — its daemon is killed).
# The APK bundles the web code inside (dist/), so it opens offline and
# feels like a real installed app. Trigger manually, or on pushes that
# touch the Capacitor config / package / workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon + splash screen (professional branding)
        # Reads assets/icon.png, assets/icon-background.png, assets/splash.png
        # (the real Dadu Food logo) and writes all Android launcher icons
        # + splash drawables into android/app/src/main/res/.
        run: npx @capacitor/assets generate --android

      - name: Sync web code into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dadufood-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
