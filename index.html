<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dadu 24#7</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D70F64" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Capture the beforeinstallprompt early in case React hasn't registered its listener yet
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        // Dispatch a custom event so React knows it has been captured if it's already mounted
        window.dispatchEvent(new CustomEvent('pwa-prompt-available', { detail: e }));
      });

      if ('serviceWorker' in navigator) {
        const registerSW = () => {
          try {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              console.log('ServiceWorker registered successfully:', reg.scope);
            }).catch((err) => {
              console.warn('ServiceWorker registration failed:', err);
            });
          } catch (e) {
            console.warn('ServiceWorker registration threw error:', e);
          }
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
  </body>
</html>
