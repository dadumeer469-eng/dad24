    <script>
      // Safe environment check to prevent SecurityError and cross-origin "Script error" in sandboxed development preview iframes
      let isTopLevel = false;
      try {
        isTopLevel = (window.parent === window);
      } catch (e) {
        isTopLevel = false;
      }

      if (isTopLevel) {
        if ('serviceWorker' in navigator) {
          const registerSW = () => {
            try {
              navigator.serviceWorker.register('/sw.js').then((reg) => {
                console.log('ServiceWorker registered successfully:', reg.scope);
              }).catch((err) => {
                console.warn('ServiceWorker registration failed:', err);
              });
            } catch (e) {
              console.warn('ServiceWorker registration error:', e);
            }
          };

          if (document.readyState === 'complete' || document.readyState === 'interactive') {
            registerSW();
          } else {
            window.addEventListener('load', registerSW);
          }
        }

        const pwaBanner = document.getElementById('pwaBanner');
        const installBtn = document.getElementById('installBtn');
        const closeBannerBtn = document.getElementById('closeBannerBtn');

        // Check if user dismissed the banner previously in this session
        const isBannerDismissed = sessionStorage.getItem('pwa-banner-dismissed');

        window.addEventListener('beforeinstallprompt', (e) => {
          // e.preventDefault();
          window.deferredPrompt = e;
          if (pwaBanner && !isBannerDismissed) {
            pwaBanner.style.display = 'block';
          }
        });

        if (installBtn) {
          installBtn.addEventListener('click', async () => {
            if (window.deferredPrompt) {
              try {
                window.deferredPrompt.prompt();
                window.deferredPrompt.userChoice.then(() => {
                  window.deferredPrompt = null;
                  if (pwaBanner) {
                    pwaBanner.style.display = 'none';
                  }
                });
              } catch (err) {
                console.warn('Prompt failed or cancelled:', err);
                window.deferredPrompt = null;
              }
            } else {
              alert("App install prompt is not ready. Please ensure you are opening this app in a full browser tab (not inside an iframe or preview window). To install manually, tap the Share button (iOS) or Menu button (Android) and select 'Add to Home Screen'.");
            }
          });
        }

        if (closeBannerBtn) {
          closeBannerBtn.addEventListener('click', () => {
            if (pwaBanner) {
              pwaBanner.style.display = 'none';
            }
            sessionStorage.setItem('pwa-banner-dismissed', 'true');
          });
        }

        window.addEventListener('appinstalled', () => {
          if (pwaBanner) {
            pwaBanner.style.display = 'none';
          }
        });
      }
    </script>
