    <!-- Beautiful, Non-Intrusive PWA Installation Banner -->
    <div id="pwaBanner" style="display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 99999; background-color: #D70F64; color: white; padding: 10px 16px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border-bottom: 1px solid rgba(255,255,255,0.15); transition: all 0.3s ease;">

        <div style="display: flex; align-items: center; gap: 8px;">

          <span>Install <strong>Dadu Food App</strong> for a faster, offline-friendly experience!</span>
        </div>

          <button id="installBtn" style="background-color: white; color: #D70F64; border: none; padding: 6px 14px; border-radius: 9999px; font-weight: 800; font-size: 11px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.2s ease;">Install 🚀</button>
          <button id="closeBannerBtn" style="background: none; color: white; border: none; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; opacity: 0.8; transition: opacity 0.2s;">✕</button>
        </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safe environment check to prevent SecurityError and cross-origin "Script error" in sandboxed development preview iframes
      let isTopLevel = false;
      try {
        isTopLevel = (window.parent === window);
      } catch (e) {
        isTopLevel = false;
      }

      if (isTopLevel) {
        if ('serviceWorker' in navigator) {
          const registerSW = () => {
            try {
              navigator.serviceWorker.register('/sw.js').then((reg) => {
                console.log('ServiceWorker registered successfully:', reg.scope);
              }).catch((err) => {
                console.warn('ServiceWorker registration failed:', err);
              });
            } catch (e) {
              console.warn('ServiceWorker registration error:', e);
            }
          };

          if (document.readyState === 'complete' || document.readyState === 'interactive') {
            registerSW();
          } else {
            window.addEventListener('load', registerSW);
          }
        }

        let deferredPrompt;
        const pwaBanner = document.getElementById('pwaBanner');
        const installBtn = document.getElementById('installBtn');
        const closeBannerBtn = document.getElementById('closeBannerBtn');

        // Check if user dismissed the banner previously in this session
        const isBannerDismissed = sessionStorage.getItem('pwa-banner-dismissed');

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          if (pwaBanner && !isBannerDismissed) {
            pwaBanner.style.display = 'block';
          }
        });

        if (installBtn) {
          installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
              try {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                  if (pwaBanner) {
                    pwaBanner.style.display = 'none';
                  }
                }
              } catch (err) {
                console.warn('Prompt failed or cancelled:', err);
              }
              deferredPrompt = null;
            }
          });
        }

        if (closeBannerBtn) {
          closeBannerBtn.addEventListener('click', () => {
            if (pwaBanner) {
              pwaBanner.style.display = 'none';
            }
            sessionStorage.setItem('pwa-banner-dismissed', 'true');
          });
        }

        window.addEventListener('appinstalled', () => {
          if (pwaBanner) {
            pwaBanner.style.display = 'none';
          }
        });
      }
    </script>
