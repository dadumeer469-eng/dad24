<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Dadu Food - Best Online Food Delivery, Fresh Groceries & Home Services</title>
    <meta name="description" content="Welcome to Dadu Food! Order delicious meals from top restaurants, shop fresh daily groceries, and hire expert home services. Fast delivery, fresh ingredients, and 24/7 convenience at your doorstep." />
    <meta name="keywords" content="Dadu Food, Dadu Food Delivery, Dadu Fast Food, Dadu Restaurant, Order Food Online, Fresh Groceries, Dadu Groceries, Home Services, Dadu Home Services, Foodpanda Dadu, Dadu Delivery, Online Food App" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dadu-food.app" />
    
    <!-- Open Graph / Facebook Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dadu-food.app" />
    <meta property="og:title" content="Dadu Food - Order Food, Groceries & Home Services Online" />
    <meta property="og:description" content="Satisfy your cravings with Dadu Food! Get piping hot meals, fresh daily essentials, and local home utility services delivered straight to your door with blazing speed." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="Dadu Food" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://dadu-food.app" />
    <meta name="twitter:title" content="Dadu Food - Blazing Fast Food & Grocery Delivery" />
    <meta name="twitter:description" content="Your favorite meals, daily groceries, and trusted local home services in one easy-to-use platform. Experience premium convenience with Dadu Food today!" />
    <meta name="twitter:image" content="/logo.png" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#D70F64" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <button id="installBtn" style="display: none; position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; background-color: #f97316; color: white; border: none; padding: 12px 24px; border-radius: 9999px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.4); font-family: sans-serif; font-size: 14px; transition: all 0.2s ease; border: 1px solid rgba(255,255,255,0.2);">Install Dadu Food App 🚀</button>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safe environment check to prevent SecurityError and cross-origin "Script error" in sandboxed development preview iframes
      let isTopLevel = false;
      try {
        isTopLevel = (window.parent === window);
      } catch (e) {
        isTopLevel = false;
      }

      if (isTopLevel) {
        if ('serviceWorker' in navigator) {
          const registerSW = () => {
            try {
              navigator.serviceWorker.register('/sw.js').then((reg) => {
                console.log('ServiceWorker registered successfully:', reg.scope);
              }).catch((err) => {
                console.warn('ServiceWorker registration failed:', err);
              });
            } catch (e) {
              console.warn('ServiceWorker registration error:', e);
            }
          };

          if (document.readyState === 'complete' || document.readyState === 'interactive') {
            registerSW();
          } else {
            window.addEventListener('load', registerSW);
          }
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          if (installBtn) {
            installBtn.style.display = 'block';
          }
        });

        if (installBtn) {
          installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
              try {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                  installBtn.style.display = 'none';
                }
              } catch (err) {
                console.warn('Prompt failed or cancelled:', err);
              }
              deferredPrompt = null;
            }
          });
        }

        window.addEventListener('appinstalled', () => {
          if (installBtn) {
            installBtn.style.display = 'none';
          }
        });
      }
    </script>
  </body>
</html>
