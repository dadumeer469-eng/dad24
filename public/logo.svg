<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra-Clean Brand Gradient -->
    <linearGradient id="daduBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2126D"/>
      <stop offset="50%" stop-color="#D70F64"/>
      <stop offset="100%" stop-color="#B3084C"/>
    </linearGradient>

    <!-- Golden Express Accent -->
    <linearGradient id="expressGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Ambient Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="128" fill="url(#daduBgGrad)"/>

  <!-- Top Curved Gloss overlay for subtle 3D depth -->
  <path d="M0 128 C0 57.3 57.3 0 128 0 L384 0 C454.7 0 512 57.3 512 128 L512 200 C300 160 212 280 0 200 Z" fill="url(#glossHighlight)" opacity="0.6"/>

  <!-- Subtle Inner Border Frame -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>

  <!-- CENTER EMBLEM: Clean Geometric "D" + Hot Steaming Food Bowl + Rider Motion -->
  <g filter="url(#softShadow)" transform="translate(0, -10)">
    
    <!-- Outer Glowing Circle Shield -->
    <circle cx="256" cy="220" r="110" fill="#FFFFFF" opacity="0.12"/>
    <circle cx="256" cy="220" r="96" fill="#FFFFFF" opacity="0.98"/>

    <!-- Inside the White Circle Shield: Pure Brand Pink "D" + Scooter/Food Concept -->
    <!-- Stylized "D" Brand Mark -->
    <path d="M210 160 C210 160, 275 155, 295 185 C310 208, 305 235, 290 252 C270 275, 210 275, 210 275 Z" fill="none" stroke="#D70F64" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Vertical Bar of "D" forming a Delivery Flagpole / Motion line -->
    <line x1="210" y1="145" x2="210" y2="290" stroke="#D70F64" stroke-width="24" stroke-linecap="round"/>

    <!-- Hot Delicious Food Bowl in Center of D -->
    <path d="M225 225 C225 250, 275 250, 275 225 Z" fill="#D70F64"/>
    <ellipse cx="250" cy="225" rx="25" ry="6" fill="#FFD700"/>

    <!-- Steam Waves rising from bowl -->
    <path d="M240 212 C240 205, 245 203, 245 196" stroke="#D70F64" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M250 210 C250 201, 255 199, 255 190" stroke="#D70F64" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M260 212 C260 205, 265 203, 265 196" stroke="#D70F64" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Speed Lightning Bolt on Top Right -->
    <polygon points="310,140 290,170 302,170 286,200 320,162 305,162" fill="url(#expressGold)"/>

    <!-- High Speed Rider Motion Swooshes on Left -->
    <path d="M115 200 L165 200" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 10"/>
    <path d="M100 225 L175 225" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="20 12"/>
    <path d="M125 250 L160 250" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 8"/>
  </g>

  <!-- CLEAN PROFESSIONAL TYPOGRAPHY -->
  <g filter="url(#softShadow)">
    <!-- DADU FOOD TEXT -->
    <text x="256" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      DADU<tspan fill="#FFD700">FOOD</tspan>
    </text>

    <!-- SUBTEXT / TAGLINE -->
    <rect x="136" y="438" width="240" height="30" rx="15" fill="#000000" opacity="0.3"/>
    <text x="256" y="458" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">
      FAST DELIVERY
    </text>
  </g>
</svg>
